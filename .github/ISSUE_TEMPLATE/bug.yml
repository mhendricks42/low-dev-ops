name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the project.json if you can. Remove subscription and tenant IDs first.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LowDevOps version or commit
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
