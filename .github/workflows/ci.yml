name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - run: make check

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: make e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-evidence
          path: |
            docs/specs/M0/hello.png
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  terraform-validate:
    name: terraform validate (fixtures)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      # Generated output is snapshot-tested against these files, so validating them validates the generator.
      - name: fmt, init and validate every fixture's main.tf
        run: |
          for dir in backend/tests/fixtures/valid/*/; do
            echo "::group::$dir"
            work=$(mktemp -d)
            cp "$dir/main.tf" "$work/"
            terraform -chdir="$work" fmt -check -diff
            terraform -chdir="$work" init -backend=false -input=false -no-color
            terraform -chdir="$work" validate -no-color
            echo "::endgroup::"
          done

  devcontainer:
    name: make check (dev container)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # devcontainer.json bind-mounts ~/.azure; CI has no az login, so give it an empty one.
      - run: mkdir -p ~/.azure
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: make check
