name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.1"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - run: make check

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.1"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: make e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-evidence
          path: |
            docs/specs/M0/hello.png
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  devcontainer:
    name: make check (dev container)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # devcontainer.json bind-mounts ~/.azure; CI has no az login, so give it an empty one.
      - run: mkdir -p ~/.azure
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: make check
