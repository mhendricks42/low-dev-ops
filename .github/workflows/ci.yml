name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - run: make check

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: make e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-evidence
          path: |
            docs/specs/M3/*.png
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  terraform-validate:
    name: terraform validate (fixtures)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # terraform init runs downloaded provider binaries; keep the token out of .git/config.
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      # Generated output is snapshot-tested against these files, so validating them validates the generator.
      - name: fmt, init and validate every fixture's main.tf
        run: |
          for dir in backend/tests/fixtures/valid/*/; do
            echo "::group::$dir"
            work=$(mktemp -d)
            cp "$dir/main.tf" "$work/"
            terraform -chdir="$work" fmt -check -diff
            terraform -chdir="$work" init -backend=false -input=false -no-color
            terraform -chdir="$work" validate -no-color
            echo "::endgroup::"
          done

  check-catalog:
    name: check-catalog
    runs-on: ubuntu-24.04
    env:
      # Ten examples share one download of each provider.
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # terraform init runs downloaded provider binaries; keep the token out of .git/config.
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - run: cd backend && uv sync --locked
      # Each entry: init resolves the exact pin, its inputs and outputs match the module, and its
      # generated example passes terraform validate.
      - run: scripts/check-catalog

  devcontainer:
    name: make check (dev container)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # devcontainer.json bind-mounts ~/.azure; CI has no az login, so give it an empty one.
      - run: mkdir -p ~/.azure
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: make check
