schemaVersion: 1
module: avm-res-resources-resourcegroup
version: 0.4.0
title: Resource group
category: foundation
cafAbbreviation: rg
nameRules: { min: 1, max: 64, chars: "a-zA-Z0-9._-" }
inputs:
  name: { tier: basic, fill: name, default: rg-x }
  location: { tier: basic, fill: location }
  tags: { tier: advanced }
  enable_telemetry: { tier: hidden, default: false }
outputs: [name, resource_id]
