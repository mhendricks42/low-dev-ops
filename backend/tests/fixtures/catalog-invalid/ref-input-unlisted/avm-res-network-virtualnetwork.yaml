schemaVersion: 1
module: avm-res-network-virtualnetwork
version: 0.22.3
title: Virtual network
category: foundation
cafAbbreviation: vnet
nameRules: { min: 1, max: 64, chars: "a-zA-Z0-9._-" }
inputs:
  name: { tier: basic, fill: name }
  location: { tier: basic, fill: location }
  address_space: { tier: basic, default: ["10.0.0.0/16"] }
